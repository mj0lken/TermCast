name: Bug Report / Feature Request
description: Report a bug or suggest an improvement for Termcast.
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened or what would you like to see?
      placeholder: Describe the issue or feature request clearly.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Termcast version + macOS version
      placeholder: e.g. 0.2.0 stable, macOS 26.0
    validations:
      required: false
