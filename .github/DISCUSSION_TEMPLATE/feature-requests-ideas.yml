labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        > [!IMPORTANT]
        > Many ideas have already been declined on purpose. Read [What Tinycast Won't Do](https://github.com/abue-ammar/tinycast/blob/main/docs/not-planned.md) first.
        >
        > **Like an idea that's already here? Upvote it instead of opening a new one.**
  - type: textarea
    id: what
    attributes:
      label: What should it do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why does it belong in Termcast?
      description: >
        Tell us what workflow this improves and why it belongs in Termcast.
    validations:
      required: true
