name: Sync Upstream

# Polls abue-ammar/tinycast:main and auto-merges clean updates into main (or leaves a PR open on conflicts/failures).
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM_REPO: https://github.com/abue-ammar/tinycast.git
  SYNC_BRANCH: sync/upstream-main

jobs:
  check:
    if: github.repository != 'abue-ammar/tinycast'
    runs-on: ubuntu-latest
    outputs:
      ahead: ${{ steps.diff.outputs.ahead }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Check upstream for new commits
        id: diff
        run: |
          git fetch --tags "$UPSTREAM_REPO" refs/heads/main:refs/remotes/upstream/main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "ahead=false" >> "$GITHUB_OUTPUT"
            echo "Already up to date with upstream/main ($(git rev-parse --short upstream/main))."
          else
            echo "ahead=true" >> "$GITHUB_OUTPUT"
            echo "Upstream is ahead by $(git rev-list --count HEAD..upstream/main) commit(s)."
          fi

      - name: Close superseded sync PR if already merged
        if: steps.diff.outputs.ahead == 'false'
        uses: actions/github-script@v8
        env:
          SYNC_BRANCH: ${{ env.SYNC_BRANCH }}
        with:
          script: |
            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            const head = `${repo.owner}:${process.env.SYNC_BRANCH}`;
            const { data: prs } = await github.rest.pulls.list({ ...repo, state: "open", head, base: "main" });
            for (const pr of prs) {
              await github.rest.issues.createComment({
                ...repo,
                issue_number: pr.number,
                body: "Closing automatically: `main` now includes all commits from `abue-ammar/tinycast:main`.",
              });
              await github.rest.pulls.update({ ...repo, pull_number: pr.number, state: "closed" });
            }

  sync:
    needs: check
    if: needs.check.outputs.ahead == 'true'
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-latest' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Merge upstream and regenerate Xcode project
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags "$UPSTREAM_REPO" refs/heads/main:refs/remotes/upstream/main

          COUNT="$(git rev-list --count HEAD..upstream/main)"
          SHA="$(git rev-parse --short upstream/main)"
          {
            echo "count=$COUNT"
            echo "sha=$SHA"
          } >> "$GITHUB_OUTPUT"

          git log --no-merges --pretty=format:'- `abue-ammar/tinycast@%h` %s' HEAD..upstream/main | head -n 60 > "$RUNNER_TEMP/commits.md"
          if [ "$COUNT" -gt 60 ]; then
            echo "- …and $((COUNT - 60)) earlier commit(s)" >> "$RUNNER_TEMP/commits.md"
          fi

          git checkout -B "$SYNC_BRANCH" HEAD

          if ! git merge --no-commit --no-ff upstream/main; then
            node Scripts/rebrand-strings.js --resolve-conflicts
            UNMERGED="$(git diff --name-only --diff-filter=U)"
            if echo "$UNMERGED" | grep -qx "Tinycast.xcodeproj/project.pbxproj" &&
               ! echo "$UNMERGED" | grep -qx "project.yml"; then
              git checkout --ours Tinycast.xcodeproj/project.pbxproj
            fi
            UNMERGED="$(git diff --name-only --diff-filter=U)"
            if [ -n "$UNMERGED" ]; then
              printf '%s\n' "$UNMERGED" > "$RUNNER_TEMP/conflicts.txt"
              git merge --abort
              git reset --hard upstream/main
              echo "state=conflicted" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          node Scripts/rebrand-strings.js
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate
          git add Tinycast.xcodeproj/project.pbxproj Tinycast/Resources/Localizable.xcstrings Tinycast/Resources/InfoPlist.xcstrings
          git commit -m "Merge upstream tinycast ($SHA)"
          echo "state=clean" >> "$GITHUB_OUTPUT"

      - name: Verify merged tree
        id: verify
        if: steps.merge.outputs.state == 'clean'
        run: |
          STATUS_FILE="$RUNNER_TEMP/checks.md"
          : > "$STATUS_FILE"
          FAILED=0

          record() {
            local label="$1"
            shift
            if "$@"; then
              echo "- [x] $label" >> "$STATUS_FILE"
            else
              echo "- [ ] $label *(failed — inspect workflow logs)*" >> "$STATUS_FILE"
              FAILED=1
            fi
          }

          check_model_purity() {
            ! grep -rln 'import AppKit\|import SwiftUI\|import Cocoa' Tinycast/Features/*/Model/
          }

          command -v swiftlint >/dev/null || brew install swiftlint

          record "Pure \`Model/\` layer check" check_model_purity
          record "SwiftLint (\`swiftlint lint --quiet\`)" swiftlint lint --quiet
          record "Settings search catalog (\`check-settings-search.js\`)" node Scripts/check-settings-search.js
          record "Localizations (\`check-localizations.js\`)" node Scripts/check-localizations.js
          record "Migrations (\`check-migrations.sh\`)" ./Scripts/check-migrations.sh

          XCODE_PATH="$(find -E /Applications -maxdepth 1 -type d -regex '.*/Xcode_(27|26)(\.[0-9]+)*\.app' | sort -V | tail -n1 || true)"
          if [ -z "$XCODE_PATH" ] && [ -d /Applications/Xcode.app ]; then
            XCODE_PATH="/Applications/Xcode.app"
          fi
          if [ -n "$XCODE_PATH" ]; then
            export DEVELOPER_DIR="$XCODE_PATH/Contents/Developer"
          fi

          SDK_MAJOR="$(xcrun --sdk macosx --show-sdk-version 2>/dev/null | cut -d. -f1 || echo 0)"
          if [ "${SDK_MAJOR:-0}" -ge 26 ]; then
            record "Debug build (\`xcodebuild -configuration Debug\`)" \
              xcodebuild -project Tinycast.xcodeproj -scheme Tinycast -configuration Debug \
                -derivedDataPath "$RUNNER_TEMP/DerivedData" \
                CODE_SIGN_IDENTITY="-" \
                build
          else
            echo "- [x] Xcode build skipped on runner SDK ${SDK_MAJOR} *(macOS 26+ SDK not installed on this runner)*" >> "$STATUS_FILE"
          fi

          if [ "$FAILED" -eq 0 ]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push sync branch
        run: git push --force origin "$SYNC_BRANCH"

      - name: Create or update sync PR (and auto-merge if clean)
        uses: actions/github-script@v8
        env:
          SYNC_BRANCH: ${{ env.SYNC_BRANCH }}
          MERGE_STATE: ${{ steps.merge.outputs.state }}
          CHECKS_PASSED: ${{ steps.verify.outputs.passed }}
          COMMIT_COUNT: ${{ steps.merge.outputs.count }}
          UPSTREAM_SHA: ${{ steps.merge.outputs.sha }}
        with:
          script: |
            const fs = require("fs");
            const path = require("path");
            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            const branch = process.env.SYNC_BRANCH;
            const state = process.env.MERGE_STATE;
            const checksPassed = process.env.CHECKS_PASSED === "true";
            const count = process.env.COMMIT_COUNT;
            const sha = process.env.UPSTREAM_SHA;
            const temp = process.env.RUNNER_TEMP;

            const commits = fs.readFileSync(path.join(temp, "commits.md"), "utf8").trim();
            const title = `chore(sync): integrate upstream tinycast (${count} commit${count === "1" ? "" : "s"} through ${sha})`;

            const lines = [];
            if (state === "clean") {
              const checks = fs.readFileSync(path.join(temp, "checks.md"), "utf8").trim();
              if (checksPassed) {
                lines.push(
                  "> [!NOTE]",
                  "> Clean upstream merge with all checks passing — configured to **auto-merge with a merge commit** to preserve shared history with `abue-ammar/tinycast:main`.",
                );
              } else {
                lines.push(
                  "> [!WARNING]",
                  "> Merge succeeded cleanly, but one or more verification checks failed — leaving this PR open for manual review. Merge with **Create a merge commit** (never *Squash* or *Rebase*) once resolved.",
                );
              }
              lines.push("", "### Verification", checks);
            } else {
              const conflicts = fs.readFileSync(path.join(temp, "conflicts.txt"), "utf8")
                .trim()
                .split("\n")
                .map((f) => `- \`${f}\``)
                .join("\n");
              lines.push(
                "> [!WARNING]",
                "> Automatic merge hit source conflicts — leaving this PR open so `main` stays untouched until resolved locally.",
                "",
                "### Conflicting files",
                conflicts,
                "",
                "### Resolve locally",
                "```sh",
                "git checkout main && git pull origin main",
                "./Scripts/sync-upstream.sh",
                "# resolve conflicts, git add them, then:",
                "./Scripts/sync-upstream.sh --continue",
                "git push origin main",
                "```",
              );
            }

            lines.push("", `### Upstream commits (\`${sha}\`)`, commits);
            const body = lines.join("\n");

            const head = `${repo.owner}:${branch}`;
            const { data: existing } = await github.rest.pulls.list({ ...repo, state: "open", head, base: "main" });

            let pr;
            try {
              if (existing.length > 0) {
                const updated = await github.rest.pulls.update({ ...repo, pull_number: existing[0].number, title, body });
                pr = updated.data;
                core.info(`Updated sync PR #${pr.number}: ${pr.html_url}`);
              } else {
                const created = await github.rest.pulls.create({
                  ...repo,
                  title,
                  head: branch,
                  base: "main",
                  body,
                });
                pr = created.data;
                core.info(`Created sync PR #${pr.number}: ${pr.html_url}`);
              }
            } catch (err) {
              const compare = `https://github.com/${repo.owner}/${repo.repo}/compare/main...${branch}?expand=1`;
              const settings = `https://github.com/${repo.owner}/${repo.repo}/settings/actions`;
              core.error(`Branch '${branch}' was pushed. Open PR manually: ${compare}`);
              core.setFailed(
                `Could not create PR automatically (${err.message}). Enable "Allow GitHub Actions to create and approve pull requests" in ${settings}.`
              );
              return;
            }

            if (state === "clean" && checksPassed) {
              try {
                await github.rest.pulls.merge({
                  ...repo,
                  pull_number: pr.number,
                  commit_title: title,
                  merge_method: "merge",
                });
                core.info(`Auto-merged sync PR #${pr.number} into main.`);
                try {
                  await github.rest.git.deleteRef({ ...repo, ref: `heads/${branch}` });
                } catch (_) {
                  // Ignore if branch was already deleted.
                }
              } catch (mergeErr) {
                core.warning(`Auto-merge skipped (${mergeErr.message}); PR #${pr.number} remains open for manual merge.`);
                await github.rest.issues.createComment({
                  ...repo,
                  issue_number: pr.number,
                  body: `Auto-merge could not complete automatically (\`${mergeErr.message}\`). Please merge manually using **Create a merge commit**.`,
                });
              }
            }
