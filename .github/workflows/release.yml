name: Release

run-name: "Termcast ${{ inputs.version }} · ${{ inputs.channel }} #${{ github.run_number }}"

# Beta builds get an auto-incrementing suffix so re-running never collides.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        type: choice
        options: [beta, stable]
        default: beta
      version:
        description: "Base version, e.g. 0.2.0 (no channel suffix)"
        type: string
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-latest' }}
    environment: release
    outputs:
      full_version: ${{ steps.meta.outputs.full_version }}
      display_name: ${{ steps.meta.outputs.display_name }}
      bundle_id: ${{ steps.meta.outputs.bundle_id }}
    steps:
      - name: Verify release secrets
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          missing=()
          for var in DEVELOPER_ID_P12_BASE64 DEVELOPER_ID_P12_PASSWORD NOTARY_KEY_P8_BASE64 NOTARY_KEY_ID NOTARY_ISSUER_ID UPDATE_SIGNING_KEY; do
            if [ -z "${!var:-}" ]; then missing+=("$var"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing secret(s) in the 'release' environment: ${missing[*]}. Configure them under Settings → Environments → release (see docs/signing.md §2)."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Check migrations
        run: ./Scripts/check-migrations.sh

      - name: Select Xcode (macOS 26+ SDK)
        run: |
          XCODE_PATH="$(find -E /Applications -maxdepth 1 -type d -regex '.*/Xcode_(27|26)(\.[0-9]+)*\.app' | sort -V | tail -n1)"
          if [ -z "$XCODE_PATH" ] && [ -d /Applications/Xcode.app ]; then
            XCODE_PATH="/Applications/Xcode.app"
          fi
          if [ -z "$XCODE_PATH" ]; then
            echo "::error::No Xcode installation found on this runner."
            ls /Applications | grep -i xcode || true
            exit 1
          fi
          export DEVELOPER_DIR="$XCODE_PATH/Contents/Developer"
          SDK_MAJOR="$(xcrun --sdk macosx --show-sdk-version 2>/dev/null | cut -d. -f1 || echo 0)"
          if [ "${SDK_MAJOR:-0}" -lt 26 ]; then
            echo "::error::Termcast requires macOS 26+ SDK (found macOS SDK ${SDK_MAJOR} in $XCODE_PATH). Set repository variable MACOS_RUNNER to a macOS 26 / Xcode 26+ runner."
            ls /Applications | grep -i xcode || true
            exit 1
          fi
          echo "Using $XCODE_PATH (macOS SDK $(xcrun --sdk macosx --show-sdk-version))"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"

      - name: Compute release metadata
        id: meta
        env:
          CHANNEL: ${{ inputs.channel }}
          BASE_VERSION: ${{ inputs.version }}
        run: |
          case "$CHANNEL" in
            beta)   SUFFIX="-beta.${GITHUB_RUN_NUMBER}"; DISPLAY="Termcast Beta"; BUNDLE="com.mj0lken.termcast.beta"; CASK="termcast@beta"; PRERELEASE=true ;;
            stable) SUFFIX="";                           DISPLAY="Termcast";      BUNDLE="com.mj0lken.termcast";      CASK="termcast";      PRERELEASE=false ;;
          esac
          FULL="${BASE_VERSION}${SUFFIX}"
          {
            echo "full_version=${FULL}"
            echo "display_name=${DISPLAY}"
            echo "bundle_id=${BUNDLE}"
            echo "cask_name=${CASK}"
            echo "dmg_file=Termcast-${FULL}.dmg"
            echo "zip_file=Termcast-${FULL}.zip"
            echo "prerelease=${PRERELEASE}"
          } >> "$GITHUB_OUTPUT"

      - name: Import signing certificate
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          CONFIGURED_IDENTITY: ${{ vars.SIGNING_IDENTITY }}
          CONFIGURED_TEAM: ${{ vars.DEVELOPMENT_TEAM }}
        run: |
          ./Scripts/import-signing-identity.sh
          IDENTITY="$CONFIGURED_IDENTITY"
          if [ -z "$IDENTITY" ]; then
            IDENTITY="$(security find-identity -v -p codesigning "$RUNNER_TEMP/signing.keychain-db" | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' | head -n1)"
          fi
          if [ -z "$IDENTITY" ]; then
            echo "::error::No 'Developer ID Application' signing identity found in the imported certificate."
            exit 1
          fi
          TEAM="$CONFIGURED_TEAM"
          if [ -z "$TEAM" ]; then
            TEAM="$(printf '%s\n' "$IDENTITY" | sed -n 's/.*(\([A-Z0-9]\{10\}\))$/\1/p')"
          fi
          if [ -z "$TEAM" ]; then
            echo "::error::Could not determine 10-character Apple Team ID from '$IDENTITY'. Set DEVELOPMENT_TEAM in the 'release' environment variables."
            exit 1
          fi
          echo "Signing with: $IDENTITY (Team $TEAM)"
          {
            echo "SIGNING_IDENTITY=$IDENTITY"
            echo "DEVELOPMENT_TEAM=$TEAM"
          } >> "$GITHUB_ENV"

      - name: Build app
        env:
          VERSION: ${{ steps.meta.outputs.full_version }}
          DISPLAY_NAME: ${{ steps.meta.outputs.display_name }}
          BUNDLE_ID: ${{ steps.meta.outputs.bundle_id }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          xcodebuild -project Tinycast.xcodeproj -scheme Tinycast -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            OTHER_CODE_SIGN_FLAGS="--timestamp" \
            PRODUCT_NAME="$DISPLAY_NAME" TINYCAST_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            build

      - name: Assert the build is arm64-only
        env:
          DISPLAY_NAME: ${{ steps.meta.outputs.display_name }}
        run: |
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release/${DISPLAY_NAME}.app"
          for BIN in "$APP/Contents/MacOS/${DISPLAY_NAME}" "$APP/Contents/Helpers/ClipboardTextHelper" "$APP/Contents/Helpers/FileIndexHelper" "$APP/Contents/Helpers/Tinycast Dictation.app/Contents/MacOS/Tinycast Dictation"; do
            SLICES="$(lipo -archs "$BIN")"
            if [ "$SLICES" != "arm64" ]; then
              echo "::error::${BIN##*/}: expected arm64 alone, got '$SLICES'"
              exit 1
            fi
          done

      - name: Assert the signature is notarizable
        env:
          DISPLAY_NAME: ${{ steps.meta.outputs.display_name }}
        run: ./Scripts/verify-signature.sh "$RUNNER_TEMP/DerivedData/Build/Products/Release/${DISPLAY_NAME}.app"

      - name: Assert the last release can install this build
        env:
          GH_TOKEN: ${{ github.token }}
          DISPLAY_NAME: ${{ steps.meta.outputs.display_name }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          ./Scripts/check-update-path.sh "$RUNNER_TEMP/DerivedData/Build/Products/Release/${DISPLAY_NAME}.app" "$CHANNEL"

      - name: Notarize DMG and ZIP
        env:
          DISPLAY_NAME: ${{ steps.meta.outputs.display_name }}
          DMG_FILE: ${{ steps.meta.outputs.dmg_file }}
          ZIP_FILE: ${{ steps.meta.outputs.zip_file }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          ./Scripts/package-release.sh "$RUNNER_TEMP/DerivedData/Build/Products/Release/${DISPLAY_NAME}.app" \
            "dist/${DMG_FILE}" "dist/${ZIP_FILE}"

      - uses: actions/upload-artifact@v7
        with:
          name: Termcast-${{ steps.meta.outputs.full_version }}
          path: dist/

      - name: Compose release notes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CHANNEL: ${{ inputs.channel }}
          TAG: v${{ steps.meta.outputs.full_version }}
          SHA: ${{ github.sha }}
          VERSION: ${{ steps.meta.outputs.full_version }}
          DISPLAY_NAME: ${{ steps.meta.outputs.display_name }}
          BUNDLE_ID: ${{ steps.meta.outputs.bundle_id }}
          CASK: ${{ steps.meta.outputs.cask_name }}
          TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO }}
        run: ./Scripts/release-notes.sh "$RUNNER_TEMP/notes.md" "$RUNNER_TEMP/changelog.md"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.meta.outputs.full_version }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
          DISPLAY_NAME: ${{ steps.meta.outputs.display_name }}
          FULL_VERSION: ${{ steps.meta.outputs.full_version }}
          DMG_FILE: ${{ steps.meta.outputs.dmg_file }}
          ZIP_FILE: ${{ steps.meta.outputs.zip_file }}
        run: |
          ARGS=(--title "${DISPLAY_NAME} ${FULL_VERSION}" --notes-file "$RUNNER_TEMP/notes.md")
          if [ "$PRERELEASE" = "true" ]; then
            ARGS+=(--prerelease)
          fi
          gh release create "$TAG" \
            "dist/${DMG_FILE}" \
            "dist/${ZIP_FILE}" \
            "dist/${ZIP_FILE}.sig" \
            "${ARGS[@]}"

      - name: Announce on Discord
        if: success()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CHANNEL: ${{ inputs.channel }}
          DISPLAY_NAME: ${{ steps.meta.outputs.display_name }}
          VERSION: ${{ steps.meta.outputs.full_version }}
          CASK: ${{ steps.meta.outputs.cask_name }}
          TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO }}
          TAG: v${{ steps.meta.outputs.full_version }}
        run: |
          if [ -z "${DISCORD_WEBHOOK_URL}" ]; then
            echo "DISCORD_WEBHOOK_URL secret not set — skipping Discord announcement."
            exit 0
          fi
          if [ "${CHANNEL}" = "stable" ]; then COLOR=3066993; else COLOR=15844367; fi
          RELEASE_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          if [ -n "${TAP_REPO}" ]; then
            TAP_SLUG="${TAP_REPO%/homebrew-*}/${TAP_REPO#*/homebrew-}"
            INSTALL_NOTE="**Install / update via Homebrew**\n\`\`\`\nbrew install --cask ${TAP_SLUG}/${CASK}\n\`\`\`"
          else
            INSTALL_NOTE="Download **${DISPLAY_NAME}-${VERSION}.dmg** from GitHub Releases."
          fi
          jq -n \
            --argjson color "${COLOR}" \
            --arg heading "## 🚀 ${DISPLAY_NAME} ${VERSION}" \
            --arg sub "Now available on the **${CHANNEL}** channel." \
            --arg install_note "${INSTALL_NOTE}" \
            --arg url "${RELEASE_URL}" \
            --rawfile changelog "${RUNNER_TEMP}/changelog.md" \
            '{
              flags: 32768,
              allowed_mentions: { parse: ["everyone"] },
              components: [
                { type: 10, content: "@everyone" },
                { type: 17, accent_color: $color, components: [
                  { type: 9,
                    components: [ { type: 10, content: ($heading + "\n" + $sub) } ],
                    accessory: { type: 2, style: 5, label: "Download", url: $url }
                  },
                  { type: 14 },
                  { type: 10, content: ($changelog | rtrimstr("\n")) },
                  { type: 14 },
                  { type: 10, content: $install_note }
                ] }
              ]
            }' > payload.json
          curl -fsS -X POST -H "Content-Type: application/json" -d @payload.json \
            "${DISCORD_WEBHOOK_URL}?with_components=true"

  universal:
    needs: build
    if: inputs.channel == 'stable'
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-latest' }}
    environment: release
    env:
      VERSION: ${{ needs.build.outputs.full_version }}
      DISPLAY_NAME: ${{ needs.build.outputs.display_name }}
      BUNDLE_ID: ${{ needs.build.outputs.bundle_id }}
      CASK: termcast-universal
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode (macOS 26+ SDK)
        run: |
          XCODE_PATH="$(find -E /Applications -maxdepth 1 -type d -regex '.*/Xcode_(27|26)(\.[0-9]+)*\.app' | sort -V | tail -n1)"
          if [ -z "$XCODE_PATH" ] && [ -d /Applications/Xcode.app ]; then
            XCODE_PATH="/Applications/Xcode.app"
          fi
          export DEVELOPER_DIR="$XCODE_PATH/Contents/Developer"
          echo "Using $XCODE_PATH (macOS SDK $(xcrun --sdk macosx --show-sdk-version))"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"

      - name: Import signing certificate
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          CONFIGURED_IDENTITY: ${{ vars.SIGNING_IDENTITY }}
          CONFIGURED_TEAM: ${{ vars.DEVELOPMENT_TEAM }}
        run: |
          ./Scripts/import-signing-identity.sh
          IDENTITY="${CONFIGURED_IDENTITY:-$(security find-identity -v -p codesigning "$RUNNER_TEMP/signing.keychain-db" | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' | head -n1)}"
          TEAM="${CONFIGURED_TEAM:-$(printf '%s\n' "$IDENTITY" | sed -n 's/.*(\([A-Z0-9]\{10\}\))$/\1/p')}"
          {
            echo "SIGNING_IDENTITY=$IDENTITY"
            echo "DEVELOPMENT_TEAM=$TEAM"
          } >> "$GITHUB_ENV"

      - name: Build app
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          xcodebuild -project Tinycast.xcodeproj -scheme Tinycast -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            OTHER_CODE_SIGN_FLAGS="--timestamp" \
            PRODUCT_NAME="$DISPLAY_NAME" TINYCAST_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            build

      - name: Assert both slices on the shipping binaries
        run: |
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release/${DISPLAY_NAME}.app"
          PLIST_MIN="$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$APP/Contents/Info.plist")"
          if [ "$PLIST_MIN" != "26.0" ]; then
            echo "::error::expected LSMinimumSystemVersion 26.0, got $PLIST_MIN"
            exit 1
          fi
          for BIN in "$APP/Contents/MacOS/${DISPLAY_NAME}" "$APP/Contents/Helpers/ClipboardTextHelper" "$APP/Contents/Helpers/FileIndexHelper" "$APP/Contents/Helpers/Tinycast Dictation.app/Contents/MacOS/Tinycast Dictation"; do
            SLICES="$(lipo -archs "$BIN")"
            for A in arm64 x86_64; do
              case " $SLICES " in
                *" $A "*) ;;
                *) echo "::error::${BIN##*/}: no $A slice — this is not a universal build"; exit 1 ;;
              esac
              MINOS="$(xcrun vtool -arch "$A" -show-build-version "$BIN" | awk '/minos/{print $2}')"
              if [ "$MINOS" != "26.0" ]; then
                echo "::error::${BIN##*/} $A: expected a macOS 26.0 floor, got minos=$MINOS"
                exit 1
              fi
            done
          done

      - name: Assert the signature is notarizable
        run: ./Scripts/verify-signature.sh "$RUNNER_TEMP/DerivedData/Build/Products/Release/${DISPLAY_NAME}.app"

      - name: Notarize DMG and ZIP
        env:
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          ./Scripts/package-release.sh "$RUNNER_TEMP/DerivedData/Build/Products/Release/${DISPLAY_NAME}.app" \
            "dist/Termcast-Universal-${VERSION}.dmg" "dist/Termcast-Universal-${VERSION}.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: Termcast-Universal-${{ needs.build.outputs.full_version }}
          path: dist/

      - name: Attach to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "v${VERSION}" \
            "dist/Termcast-Universal-${VERSION}.dmg" \
            "dist/Termcast-Universal-${VERSION}.zip" \
            "dist/Termcast-Universal-${VERSION}.zip.sig"

      - name: Update Homebrew cask
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO }}
        run: |
          if [ -z "${TAP_TOKEN}" ] || [ -z "${TAP_REPO}" ]; then
            echo "HOMEBREW_TAP_TOKEN or HOMEBREW_TAP_REPO not set — skipping cask bump."
            exit 0
          fi
          SHA="$(shasum -a 256 "dist/Termcast-Universal-${VERSION}.dmg" | awk '{print $1}')"
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git" tap
          CASK_FILE="tap/Casks/${CASK}.rb"
          if [ ! -f "$CASK_FILE" ]; then
            echo "::error::$CASK_FILE not found in tap ${TAP_REPO}."
            exit 1
          fi
          sed -i '' -E "s|^  version \".*\"|  version \"${VERSION}\"|" "$CASK_FILE"
          sed -i '' -E "s|^  sha256 \".*\"|  sha256 \"${SHA}\"|" "$CASK_FILE"
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Casks/${CASK}.rb"
          if git diff --cached --quiet; then
            echo "No cask changes to commit."
          else
            git commit -m "${CASK} ${VERSION}"
            git push
          fi
