name: PR Checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Build, test and lint
    runs-on: ${{ vars.PR_CHECKS_RUNNER || vars.MACOS_RUNNER || 'macos-latest' }}
    timeout-minutes: 45
    steps:
      # check-migrations reads tags and full history to tell shipped migrations apart.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Select Xcode 27+
        run: |
          XCODE_PATH="$(find -E /Applications -maxdepth 1 -type d -regex '.*/Xcode_27(\.[0-9]+)*\.app' | sort -V | tail -n1)"
          if [ -z "$XCODE_PATH" ] && [ -d /Applications/Xcode.app ]; then
            XCODE_PATH="/Applications/Xcode.app"
          fi
          if [ -z "$XCODE_PATH" ]; then
            echo "::error::No Xcode installation found on this runner."
            ls /Applications | grep -i xcode || true
            exit 1
          fi
          export DEVELOPER_DIR="$XCODE_PATH/Contents/Developer"
          SDK_MAJOR="$(xcrun --sdk macosx --show-sdk-version 2>/dev/null | cut -d. -f1 || echo 0)"
          if [ "${SDK_MAJOR:-0}" -lt 27 ]; then
            echo "::error::Termcast requires Xcode 27+ (Swift 6.4+), found macOS SDK ${SDK_MAJOR} in $XCODE_PATH. Set repository variable MACOS_RUNNER to an Xcode 27 runner."
            ls /Applications | grep -i xcode || true
            exit 1
          fi
          echo "Using $XCODE_PATH (macOS SDK $(xcrun --sdk macosx --show-sdk-version))"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"

      - name: Install SwiftLint
        run: command -v swiftlint >/dev/null || brew install swiftlint

      - name: Model purity
        run: |
          impure="$(grep -rln 'import AppKit\|import SwiftUI\|import Cocoa' Tinycast/Features/*/Model/ || true)"
          if [ -n "$impure" ]; then
            echo "::error::Model files may not import AppKit, SwiftUI or Cocoa:"
            echo "$impure"
            exit 1
          fi

      - name: Lint
        run: ./Scripts/lint.sh

      - name: Build (Debug)
        run: |
          xcodebuild build -quiet -project Tinycast.xcodeproj -scheme Tinycast -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" CODE_SIGNING_ALLOWED=NO

      - name: Tests
        run: ./Scripts/run-tests.sh
