name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/images/icon.png"
      - "docs/screenshot.png"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository != 'abue-ammar/tinycast'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Stage static site
        run: |
          mkdir -p _site/assets
          cp site/index.html site/styles.css site/app.js site/favicon.svg _site/
          cp docs/images/icon.png _site/assets/icon.png
          cp docs/screenshot.png _site/assets/screenshot.png
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
